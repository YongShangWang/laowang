<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="aAcTLGD5QXipnpI1gFRCCx">
<head data-page-node-id="mIzHbpB0KqWJDXUzw9edpf">

<title>老王会员社区</title>
<style>
:root{
  --brand:#8B5E3C;
  --brand-2:#5A3822;
  --bg:#f5f6fa;
  --card:#ffffff;
  --text:#1f2333;
  --muted:#8a8fa3;
  --line:#eceef5;
  --shadow:0 2px 12px rgba(31,35,51,.05);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#e9ecf5;color:var(--text);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0}
input,textarea{font-family:inherit;font-size:15px;color:inherit;border:none;outline:none;background:none}
h1,h2,h3,p{margin:0}

.app{
  max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;
  position:relative;overflow-x:hidden;box-shadow:0 0 60px rgba(31,35,51,.10);
}
@media (max-width:520px){ .app{box-shadow:none} }

.page{min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.page.no-tab{padding-bottom:env(safe-area-inset-bottom)}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;
  justify-content:space-between;padding:0 14px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
}
.topbar h2{font-size:16px;font-weight:600;letter-spacing:.2px}
.topbar .brand{font-size:18px;font-weight:700;letter-spacing:-.3px;
  background:linear-gradient(135deg,#8B5E3C,#5A3822);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:#f2f3f8;color:#5b6072;transition:.15s;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px}
.top-right{display:flex;gap:8px}

/* ---------- login ---------- */
.login{padding:0 0 40px;min-height:100vh;background:#fff}
.login-hero{
  background:linear-gradient(150deg,#8B5E3C 0%,#5A3822 100%);
  padding:64px 28px 74px;color:#fff;position:relative;overflow:hidden;
}
.login-hero::after{
  content:"";position:absolute;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.10);right:-90px;top:-70px;
}
.login-hero::before{
  content:"";position:absolute;width:140px;height:140px;border-radius:50%;
  background:rgba(255,255,255,.08);left:-50px;bottom:-60px;
}
.logo-mark{
  width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.32);display:grid;place-items:center;
  font-size:24px;font-weight:700;letter-spacing:.5px;margin-bottom:18px;position:relative;z-index:1;
}
.login-hero h1{font-size:26px;font-weight:700;letter-spacing:-.5px;position:relative;z-index:1}
.login-hero p{font-size:13.5px;color:rgba(255,255,255,.82);margin-top:6px;position:relative;z-index:1}

.login-card{
  margin:-38px 20px 0;background:#fff;border-radius:20px;padding:22px 18px 20px;
  box-shadow:0 12px 34px rgba(60,60,120,.12);position:relative;z-index:2;
}
.field-label{font-size:13px;color:var(--muted);margin:0 0 6px 2px;display:block}
.input-row{
  display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;
  background:#f6f7fb;border:1px solid transparent;border-radius:12px;margin-bottom:14px;transition:.18s;
}
.input-row:focus-within{background:#fff;border-color:#D8BEAB;box-shadow:0 0 0 3px rgba(139,94,60,.12)}
.input-row input{flex:1;min-width:0;font-size:15px}
.input-row input::placeholder{color:#b3b8c8}
.prefix{font-size:12px;font-weight:600;color:#fff;background:#8B5E3C;border-radius:6px;padding:2px 6px;letter-spacing:.5px}
.btn{display:block;width:100%;height:48px;border-radius:12px;font-size:15.5px;font-weight:600;transition:.15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(135deg,#8B5E3C,#5A3822);color:#fff;box-shadow:0 8px 20px rgba(139,94,60,.32)}
.btn-primary[disabled]{opacity:.55;box-shadow:none}
.btn-ghost{background:#f2f3f8;color:#5b6072}
.btn-code{
  font-size:13px;font-weight:600;color:var(--brand);white-space:nowrap;
  padding:6px 2px 6px 10px;border-left:1px solid #e3e6f0;
}
.btn-code[disabled]{color:#b3b8c8}
.btn-wechat{
  background:#fff;color:#3d4255;border:1px solid #e3e6f0;display:flex;align-items:center;
  justify-content:center;gap:8px;font-weight:500;
}
.btn-wechat svg{width:20px;height:20px;color:#07c160}
.or-line{display:flex;align-items:center;gap:12px;margin:16px 0 14px;color:#c2c6d2;font-size:11.5px}
.or-line::before,.or-line::after{content:"";flex:1;height:1px;background:#eef0f6}
.login-tip{font-size:12px;color:#a8adbd;text-align:center;margin-top:14px;line-height:1.5}
.boot{padding:80px 20px;text-align:center;color:#a8adbd;font-size:13px}
.boot-fail{padding:100px 24px;text-align:center;color:#8a8fa3;font-size:14px;line-height:1.8}
.agreement{font-size:11.5px;color:#a8adbd;text-align:center;padding:26px 30px 0;line-height:1.7}
.agreement a{color:#7f8bd6}
.demo-hint{
  margin:18px 20px 0;padding:10px 14px;background:#fffcf0;border:1px solid #f6e6b8;
  border-radius:10px;font-size:12px;color:#a5811f;text-align:center;
}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;padding:12px 14px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:6px 15px;border-radius:999px;font-size:13.5px;color:#7c8194;
  background:#fff;border:1px solid var(--line);white-space:nowrap;transition:.15s;
}
.tab.on{background:linear-gradient(135deg,#8B5E3C,#5A3822);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(139,94,60,.26)}

/* ---------- post card ---------- */
.post{background:#fff;border-radius:16px;padding:15px 15px 4px;margin:10px 14px;box-shadow:var(--shadow)}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  color:#fff;font-size:15px;font-weight:600;flex:0 0 auto;letter-spacing:.5px;
}
.avatar.lg{width:56px;height:56px;border-radius:18px;font-size:22px}
.p-name{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.p-time{font-size:11.5px;color:#a8adbd;margin-top:1px}
.badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:#F5ECE5;color:#7A4A28;letter-spacing:.2px}
.badge.gold{background:linear-gradient(135deg,#f0b429,#e89b1b);color:#fff}
.post-body{font-size:14.5px;line-height:1.72;color:#33384a;white-space:pre-wrap;word-break:break-word}
.post-body.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.imgs{display:grid;gap:6px;margin-top:10px}
.imgs.c2{grid-template-columns:1fr 1fr}
.imgs.c1{grid-template-columns:1fr}
.imgs.c3{grid-template-columns:repeat(3,1fr)}
.ph{aspect-ratio:1/1;border-radius:10px;position:relative;overflow:hidden}
.imgs.c1 .ph{aspect-ratio:16/10}
.ph::after{content:attr(data-tag);position:absolute;left:8px;bottom:6px;font-size:10.5px;color:rgba(255,255,255,.9);letter-spacing:.4px}
.ph-1{background:linear-gradient(135deg,#D9B08C,#8B5E3C)}
.ph-2{background:linear-gradient(135deg,#C9A87C,#6F4E37)}
.ph-3{background:linear-gradient(135deg,#E6C79C,#A0714F)}
.ph-4{background:linear-gradient(135deg,#B98A5E,#5A3822)}
.ph-5{background:linear-gradient(135deg,#E3D5C3,#9C6B44)}
.post-foot{display:flex;align-items:center;gap:22px;padding:10px 2px 12px;margin-top:8px;border-top:1px solid #f4f5f9;color:#9aa0b2;font-size:12.5px}
.act{display:flex;align-items:center;gap:5px;transition:.15s}
.act svg{width:16px;height:16px}
.act.on{color:#f0576f}
.act.on svg{fill:#f0576f;stroke:#f0576f}
.act:active{transform:scale(.94)}
.vip-tag{margin-left:auto;font-size:10.5px;font-weight:600;color:#a5811f;background:#fdf3d8;padding:2px 7px;border-radius:5px}

.locked{position:relative;border-radius:12px;overflow:hidden;margin-top:10px}
.locked .post-body{filter:blur(4px);user-select:none;pointer-events:none}
.lock-mask{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.94));
  text-align:center;padding:16px;
}
.lock-mask svg{width:22px;height:22px;color:#8b7bd8}
.lock-mask span{font-size:12.5px;color:#6d6a8a}
.lock-btn{margin-top:2px;font-size:12.5px;font-weight:600;color:#fff;background:linear-gradient(135deg,#8B5E3C,#5A3822);padding:7px 18px;border-radius:999px}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:flex;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:30;
}
.tabbar a{
  flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;color:#9aa0b2;transition:.15s;position:relative;
}
.tabbar a.on{color:var(--brand);font-weight:600}
.tabbar svg{width:21px;height:21px}
.dot{position:absolute;top:6px;right:calc(50% - 18px);width:7px;height:7px;border-radius:50%;background:#f0576f}

/* ---------- fab ---------- */
.fab{
  position:fixed;bottom:92px;left:50%;margin-left:172px;width:52px;height:52px;border-radius:18px;
  background:linear-gradient(135deg,#8B5E3C,#5A3822);color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 24px rgba(139,94,60,.38);z-index:29;transition:.15s;
}
.fab:active{transform:scale(.94)}
.fab svg{width:22px;height:22px}
@media (max-width:520px){ .fab{left:auto;margin-left:0;right:18px} }

/* ---------- me ---------- */
.me-hero{background:linear-gradient(150deg,#8B5E3C 0%,#5A3822 100%);padding:30px 20px 56px;color:#fff;position:relative;overflow:hidden}
.me-hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.09);right:-80px;top:-90px}
.me-id{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.me-id .avatar{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);box-shadow:none}
.me-name{font-size:19px;font-weight:600;letter-spacing:.2px}
.me-sub{font-size:12px;color:rgba(255,255,255,.78);margin-top:3px;letter-spacing:.3px}
.member-card{
  margin:-40px 16px 0;background:#fff;border-radius:18px;padding:16px 16px 15px;
  box-shadow:0 10px 26px rgba(60,60,120,.10);position:relative;z-index:2;
}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mc-title{font-size:13px;color:var(--muted);letter-spacing:.3px}
.mc-state{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;background:#eef7ee;color:#3f8f4f}
.mc-state.off{background:#fdf0ef;color:#c05a52}
.mc-main{font-size:15px;font-weight:600;color:var(--text)}
.mc-main em{font-style:normal;color:var(--brand);font-size:19px;margin:0 2px}
.mc-bar{height:5px;border-radius:3px;background:#f0f1f6;margin:11px 0 10px;overflow:hidden}
.mc-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#5A3822,#B98A5E)}
.mc-foot{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#a8adbd}
.mc-btn{font-size:12.5px;font-weight:600;color:#fff;background:linear-gradient(135deg,#8B5E3C,#5A3822);padding:6px 15px;border-radius:999px}

.stat-row{display:flex;background:#fff;border-radius:16px;margin:12px 16px;padding:14px 0;box-shadow:var(--shadow)}
.stat{flex:1;text-align:center;position:relative}
.stat + .stat::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:1px;background:#f0f1f6}
.stat b{display:block;font-size:17px;font-weight:600}
.stat span{font-size:11.5px;color:var(--muted)}

.menu{background:#fff;border-radius:16px;margin:12px 16px;overflow:hidden;box-shadow:var(--shadow)}
.menu-item{display:flex;align-items:center;gap:12px;padding:15px 16px;font-size:14.5px;border-bottom:1px solid #f6f7fa;transition:.15s}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#fafbfe}
.mi-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#f2f4fd;color:#8B5E3C;flex:0 0 auto}
.mi-ico svg{width:16px;height:16px}
.menu-item .arrow{margin-left:auto;color:#c8ccd8;font-size:16px;line-height:1}
.menu-item.danger{color:#c05a52}
.menu-item.danger .mi-ico{background:#fdf0ef;color:#c05a52}

/* ---------- generic content ---------- */
.section-title{padding:18px 16px 8px;font-size:12.5px;color:var(--muted);letter-spacing:.4px}
.card{background:#fff;border-radius:16px;margin:0 16px 12px;padding:16px;box-shadow:var(--shadow)}
.divider{height:1px;background:#f4f5f9;margin:14px 0}

.textarea{
  width:100%;min-height:150px;background:#f7f8fc;border-radius:12px;padding:14px;
  font-size:15px;line-height:1.7;resize:none;border:1px solid transparent;transition:.18s;
}
.textarea:focus{background:#fff;border-color:#D8BEAB;box-shadow:0 0 0 3px rgba(139,94,60,.10)}
.field-input{
  width:100%;height:46px;background:#f7f8fc;border-radius:12px;padding:0 14px;
  border:1px solid transparent;transition:.18s;
}
.field-input:focus{background:#fff;border-color:#D8BEAB;box-shadow:0 0 0 3px rgba(139,94,60,.10)}
.counter{text-align:right;font-size:11.5px;color:#b3b8c8;padding:8px 2px 0}
.hint{font-size:12px;color:#a8adbd;line-height:1.7}

/* post detail */
.article{background:#fff;padding:18px 18px 8px}
.article h1{font-size:18px;font-weight:600;line-height:1.5;margin-bottom:12px}
.article .post-body{font-size:15.5px;line-height:1.85}
.comments{background:#fff;padding:4px 18px 22px}
.cmt-title{font-size:13px;color:var(--muted);padding:14px 0 10px;border-top:1px solid #f4f5f9}
.cmt{display:flex;gap:10px;padding:10px 0}
.cmt .avatar{width:32px;height:32px;border-radius:10px;font-size:13px}
.cmt-body{flex:1;min-width:0}
.cmt-name{font-size:13px;font-weight:600;color:#4b5063}
.cmt-text{font-size:14px;color:#3d4255;line-height:1.65;margin-top:2px;word-break:break-word}
.cmt-time{font-size:11px;color:#b3b8c8;margin-top:3px}
.cmt-empty{text-align:center;color:#b3b8c8;font-size:13px;padding:22px 0}
.input-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:30;
}
.input-bar input{flex:1;height:40px;background:#f6f7fb;border-radius:999px;padding:0 16px;font-size:14px}
.send-btn{height:40px;padding:0 18px;border-radius:999px;background:linear-gradient(135deg,#8B5E3C,#5A3822);color:#fff;font-size:14px;font-weight:600}
.send-btn[disabled]{opacity:.5}

/* questions */
.q-item{background:#fff;border-radius:16px;margin:10px 14px;padding:15px;box-shadow:var(--shadow)}
.q-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.q-status{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:#F5ECE5;color:#7A4A28}
.q-status.done{background:#eef7ee;color:#3f8f4f}
.q-title{font-size:15px;font-weight:600;line-height:1.55;color:#272c3d}
.q-desc{font-size:13px;color:#7c8194;margin-top:6px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.q-foot{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11.5px;color:#a8adbd}
.q-foot .right{margin-left:auto;color:#8b90a3}

/* messages */
.msg{display:flex;gap:12px;padding:15px 16px;background:#fff;border-bottom:1px solid #f6f7fa;transition:.15s}
.msg:active{background:#fafbfe}
.msg-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.msg-ico svg{width:19px;height:19px}
.msg-body{flex:1;min-width:0}
.msg-top{display:flex;align-items:baseline;gap:8px}
.msg-title{font-size:14px;font-weight:600}
.msg-time{margin-left:auto;font-size:11px;color:#b3b8c8;white-space:nowrap}
.msg-desc{font-size:12.5px;color:#8a8fa3;margin-top:3px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg.unread .msg-title::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#f0576f;margin-left:6px;vertical-align:middle}

/* payment */
.plans{padding:14px 16px 4px}
.plan{
  display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid transparent;
  border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:.18s;position:relative;
}
.plan.on{border-color:#8B5E3C;box-shadow:0 8px 22px rgba(139,94,60,.16)}
.plan-radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #d5d9e6;display:grid;place-items:center;flex:0 0 auto}
.plan.on .plan-radio{border-color:#8B5E3C;background:#8B5E3C}
.plan.on .plan-radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.plan-name{font-size:15.5px;font-weight:600}
.plan-desc{font-size:11.5px;color:#a8adbd;margin-top:2px}
.plan-price{margin-left:auto;text-align:right}
.plan-price b{font-size:20px;font-weight:700;color:#e0603f}
.plan-price b i{font-style:normal;font-size:13px;font-weight:600;margin-right:1px}
.plan-price s{display:block;font-size:11px;color:#c2c6d2}
.plan-hot{position:absolute;top:-9px;right:14px;font-size:10px;font-weight:600;color:#fff;background:linear-gradient(135deg,#f0b429,#e89b1b);padding:2px 8px;border-radius:5px}

.benefits{background:#fff;border-radius:16px;margin:6px 16px 12px;padding:16px;box-shadow:var(--shadow)}
.benefits h3{font-size:13.5px;font-weight:600;margin-bottom:12px}
.benefit{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:#4b5063;padding:6px 0}
.benefit svg{width:16px;height:16px;color:#3f8f4f;flex:0 0 auto;margin-top:2px}
.pay-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  display:flex;align-items:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);border-top:1px solid var(--line);z-index:30;
}
.pay-total{font-size:12px;color:var(--muted);line-height:1.4}
.pay-total b{display:block;font-size:20px;font-weight:700;color:#e0603f}
.pay-btn{flex:1;height:48px;border-radius:12px;background:linear-gradient(135deg,#8B5E3C,#5A3822);color:#fff;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 20px rgba(139,94,60,.3)}

        { id: 22, owner_id: 'system', owner_name: '林深', title: '同一个账号可以在多台设备上登录吗？', detail: '手机和平板都想用，会不会互相挤下线。', status: 'wait', answers: 0, created_at: iso(-20 * 3600e3) },
        { id: 23, owner_id: 'system', owner_name: '老陈', title: '年卡支持开发票吗？', detail: '公司报销需要，抬头可以开个人吗？', status: 'wait', answers: 0, created_at: iso(-40 * 3600e3) }
      ],
      messages: [],
      orders: [],
      likes: []
    };
  }

  function readDb() {
    var raw = null;
    try { raw = localStorage.getItem(DB_KEY); } catch (e) { raw = null; }
    if (!raw) {
      var fresh = seed();
      writeDb(fresh);
      return fresh;
    }
    try {
      var db = JSON.parse(raw);
      if (!db || !Array.isArray(db.posts)) throw new Error('bad');
      return db;
    } catch (e) {
      var re = seed();
      writeDb(re);
      return re;
    }
  }
  function writeDb(db) {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) { /* 隐私模式下忽略 */ }
  }

  function readSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; }
  }
  function writeSession(s) {
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* ignore */ }
  }

  var db = readDb();
  var session = readSession();

  function uid() { return (session && session.user && session.user.id) || ''; }
  function currentProfile() {
    var u = uid();
    if (!u) return null;
    return db.profiles.filter(function (p) { return p.owner_id === u; })[0] || null;
  }
  function isMember() {
    var p = currentProfile();
    return !!(p && p.expire_at && new Date(p.expire_at).getTime() > Date.now());
  }
  function nextId() { db.seq += 1; return db.seq; }

  // 模拟 RLS 行级权限：会员资料 / 站内消息 / 订单只对本人可见可写
  var USER_SCOPED = { profiles: 1, messages: 1, orders: 1 };

  /* ---------- 查询构造器 ---------- */
  function Query(table) {
    this.t = table;
    this.kind = 'select';
    this.filters = [];
    this.orders = [];
    this.limitN = null;
    this.payload = null;
    this.head = false;
    this.countOnly = false;
    this.singleMode = null;
  }
  Query.prototype._setKind = function (k) { if (this.kind === 'select') this.kind = k; return this; };
  Query.prototype.select = function (cols, opts) {
    if (opts && opts.count) this.countOnly = true;
    if (opts && opts.head) this.head = true;
    return this;
  };
  Query.prototype.insert = function (payload) { this.kind = 'insert'; this.payload = payload; return this; };
  Query.prototype.update = function (payload) { this._setKind('update'); this.payload = payload; return this; };
  Query.prototype.delete = function () { this._setKind('delete'); return this; };
  Query.prototype.eq = function (col, val) { this.filters.push([col, val]); return this; };
  Query.prototype.order = function (col, opts) {
    this.orders.push([col, !(opts && opts.ascending === false)]);
    return this;
  };
  Query.prototype.limit = function (n) { this.limitN = n; return this; };
  Query.prototype.maybeSingle = function () { this.singleMode = 'maybe'; return this; };
  Query.prototype.single = function () { this.singleMode = 'single'; return this; };
  Query.prototype.then = function (res, rej) { return this._run().then(res, rej); };
  Query.prototype['catch'] = function (fn) { return this._run()['catch'](fn); };

  Query.prototype._rows = function () {
    var list;
    if (this.t === 'feed_posts') list = db.posts;
    else list = db[this.t] || [];
    // 模拟 RLS：这三张表只对本人可见（云端由 row level security 保证）
    if (USER_SCOPED[this.t]) {
      var u = uid();
      list = u ? list.filter(function (r) { return r.owner_id === u; }) : [];
    }
    return list;
  };

  Query.prototype._project = function (list) {
    var self = this;
    var out = list.map(function (r) {
      var row = {};
      for (var k in r) row[k] = r[k];
      if (self.t === 'feed_posts') {
        // 视图语义：非会员读不到 V+ 正文（与云端 security_invoker 视图一致）
        if (row.is_vip && !isMember()) row.content = null;
      }
      return row;
    });
    return out;
  };

  Query.prototype._run = function () {
    var self = this;
    return Promise.resolve().then(function () {
      var rows = self._rows();

      if (self.kind === 'insert') {
        var items = Array.isArray(self.payload) ? self.payload : [self.payload];
        var inserted = items.map(function (raw) {
          var row = {};
          for (var k in raw) row[k] = raw[k];
          row.id = nextId();
          row.owner_id = row.owner_id || uid() || 'anonymous';
          row.created_at = row.created_at || iso(0);
          if (self.t === 'posts') {
            if (row.is_vip === undefined) row.is_vip = false;
            if (row.likes === undefined) row.likes = 0;
            if (row.images === undefined) row.images = [];
            if (row.preview === undefined) row.preview = null;
          }
          if (self.t === 'comments') { /* nothing */ }
          if (self.t === 'questions') {
            if (row.status === undefined) row.status = 'wait';
            if (row.answers === undefined) row.answers = 0;
          }
          if (self.t === 'messages') {
            if (row.kind === undefined) row.kind = 'system';
            if (row.is_read === undefined) row.is_read = false;
          }
          if (self.t === 'orders') {
            if (row.status === undefined) row.status = 'pending';
            if (row.paid_at === undefined) row.paid_at = null;
          }
          if (self.t === 'likes') { /* nothing */ }
          if (self.t === 'profiles') {
            if (row.expire_at === undefined) row.expire_at = null;
            if (row.created_at === undefined) row.created_at = iso(0);
          }
          rows.push(row);
          return row;
        });
        // 建档欢迎消息（对齐云端 on_profile_created 触发器）
        if (self.t === 'profiles') {
          inserted.forEach(function (p) {
            db.messages.push({
              id: nextId(), owner_id: p.owner_id, kind: 'system',
              title: '欢迎加入',
              body: '完善资料后即可发布动态与提问；开通会员可解锁全部 V+ 内容。',
              is_read: false, created_at: iso(0)
            });
          });
        }
        writeDb(db);
        return { data: inserted, error: null };
      }

      var matched = rows.filter(function (r) {
        return self.filters.every(function (f) { return String(r[f[0]]) === String(f[1]); });
      });

      if (self.kind === 'update') {
        matched.forEach(function (r) {
          for (var k in self.payload) r[k] = self.payload[k];
        });
        writeDb(db);
        return { data: matched, error: null };
      }

      if (self.kind === 'delete') {
        var keep = rows.filter(function (r) { return matched.indexOf(r) === -1; });
        if (self.t === 'feed_posts') db.posts = keep; else db[self.t] = keep;
        writeDb(db);
        return { data: matched, error: null };
      }

      // select
      self.orders.forEach(function (o) {
        var col = o[0], asc = o[1];
        matched.sort(function (a, b) {
          var av = a[col], bv = b[col];
          var an = (av === null || av === undefined) ? '' : av;
          var bn = (bv === null || bv === undefined) ? '' : bv;
          if (an === bn) return 0;
          return (an > bn ? 1 : -1) * (asc ? 1 : -1);
        });
      });
      if (self.limitN) matched = matched.slice(0, self.limitN);

      if (self.countOnly) {
        return { data: null, count: matched.length, error: null };
      }
      var projected = self._project(matched);
      if (self.singleMode) {
        return { data: projected[0] || null, error: null };
      }
      return { data: projected, error: null };
    });
  };

  /* ---------- RPC ---------- */
  function rpc(name, params) {
    return Promise.resolve().then(function () {
      var u = uid();
      if (!u) return { data: null, error: { message: 'not signed in' } };

      if (name === 'toggle_like') {
        var pid = Number(params && params.p_post_id);
        var idx = -1;
        db.likes.forEach(function (l, i) {
          if (l.owner_id === u && Number(l.post_id) === pid) idx = i;
        });
        var post = db.posts.filter(function (p) { return Number(p.id) === pid; })[0];
        if (!post) return { data: null, error: { message: 'post not found' } };
        if (idx > -1) {
          db.likes.splice(idx, 1);
          post.likes = Math.max(0, (post.likes || 0) - 1);
        } else {
          db.likes.push({ id: nextId(), owner_id: u, post_id: pid, created_at: iso(0) });
          post.likes = (post.likes || 0) + 1;
        }
        writeDb(db);
        return { data: post.likes, error: null };
      }

      if (name === 'pay_order') {
        var oid = Number(params && params.p_order_id);
        var order = db.orders.filter(function (o) {
          return Number(o.id) === oid && o.owner_id === u && o.status === 'pending';
        })[0];
        if (!order) return { data: null, error: { message: 'order not found or already paid' } };
        order.status = 'paid';
        order.paid_at = iso(0);
        var days = Number(order.days) || 0;
        var prof = currentProfile();
        if (!prof) {
          prof = { id: nextId(), owner_id: u, nickname: session.user.name || '会员', member_id: null, expire_at: null, created_at: iso(0) };
          db.profiles.push(prof);
        }
        var base = prof.expire_at && new Date(prof.expire_at).getTime() > Date.now()
          ? new Date(prof.expire_at).getTime()
          : Date.now();
        prof.expire_at = new Date(base + days * 86400e3).toISOString();
        db.messages.push({
          id: nextId(), owner_id: u, kind: 'system',
          title: '会员开通成功',
          body: '会员权益已生效，有效期 ' + days + ' 天。',
          is_read: false, created_at: iso(0)
        });
        writeDb(db);
        return { data: prof.expire_at, error: null };
      }

      return { data: null, error: { message: 'unknown rpc: ' + name } };
    });
  }

  /* ---------- Auth ---------- */
  var auth = {
    sendOtp: function (opts) {
      var phone = (opts && opts.phone) || '';
      return Promise.resolve({
        data: { verificationId: 'local-' + phone, isExistingUser: db.profiles.length > 0 },
        error: null
      });
    },
    verifyOtp: function (opts) {
      var phone = (opts && opts.phone) || '';
      var token = (opts && opts.token) || '';
      if (!/^\d{6}$/.test(token)) return Promise.resolve({ data: null, error: { message: '请输入 6 位数字验证码' } });
      session = {
        user: { id: 'local_' + phone, phone: phone, name: '会员' + phone.slice(-4) },
        access_token: 'local',
        created_at: iso(0)
      };
      writeSession(session);
      return Promise.resolve({ data: session, error: null });
    },
    getSession: function () {
      session = readSession();
      return Promise.resolve({ data: session, error: null });
    },
    signOut: function () {
      session = null;
      writeSession(null);
      return Promise.resolve({ error: null });
    },
    signInWithOAuth: function () {
      return Promise.resolve({ data: null, error: { message: '本地演示模式暂不支持微信登录，请用手机号登录' } });
    }
  };

  window.__createLocalDriver = function () {
    session = readSession();
    return {
      auth: auth,
      database: {
        from: function (table) { return new Query(table); },
        rpc: rpc
      }
    };
  };
})();

</script>
<script>
/**
 * Supabase 驱动：把 supabase-js 包成 app.js 认识的 cloud 接口
 * app.js 只调用 cloud.database.from/rpc 和 cloud.auth.*，所以业务代码一行都不用改。
 *
 * 需要的全局配置（config.js）：
 *   mode: 'supabase' | 'auto' | 'local'
 *   supabaseUrl / supabaseAnonKey
 *   loginMethod: 'email' | 'phone'
 */
(function () {
  'use strict';

  function normSession(s) {
    if (!s || !s.user) return null;
    var u = s.user;
    var meta = u.user_metadata || {};
    return {
      user: {
        id: u.id,
        email: u.email || '',
        phone: u.phone || '',
        name: meta.name || meta.nickname || (u.email ? u.email.split('@')[0] : (u.phone || '会员'))
      },
      access_token: s.access_token,
      created_at: s.expires_at ? new Date(s.expires_at * 1000).toISOString() : new Date().toISOString()
    };
  }

  window.__createSupabaseDriver = function (cfg) {
    if (!window.supabase || typeof window.supabase.createClient !== 'function') {
      throw new Error('supabase-js 未加载');
    }
    var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });

    var auth = {
      // 发验证码：邮箱走邮件、手机号走短信（短信需在 Supabase 里配服务商）
      sendOtp: function (opts) {
        var email = (opts && opts.email) || '';
        var phone = (opts && opts.phone) || '';
        var req = email
          ? sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } })
          : sb.auth.signInWithOtp({ phone: phone });
        return Promise.resolve(req).then(function (r) {
          if (r.error) return { data: null, error: r.error };
          return { data: { verificationId: email ? 'email:' + email : 'sms:' + phone, isExistingUser: true }, error: null };
        });
      },

      verifyOtp: function (opts) {
        var email = (opts && opts.email) || '';
        var phone = (opts && opts.phone) || '';
        var token = (opts && opts.token) || '';
        var req = email
          ? sb.auth.verifyOtp({ email: email, token: token, type: 'email' })
          : sb.auth.verifyOtp({ phone: phone, token: token, type: 'sms' });
        return Promise.resolve(req).then(function (r) {
          if (r.error) return { data: null, error: r.error };
          return { data: normSession(r.data && r.data.session), error: null };
        });
      },

      getSession: function () {
        return Promise.resolve(sb.auth.getSession()).then(function (r) {
          return { data: normSession(r.data && r.data.session), error: null };
        });
      },

      signOut: function () {
        return Promise.resolve(sb.auth.signOut()).then(function (r) {
          return { error: r.error || null };
        });
      },

      signInWithOAuth: function (opts) {
        var p = (opts && opts.provider) || '';
        if (p !== 'wechat') return Promise.resolve({ data: null, error: { message: '暂只支持微信登录' } });
        return Promise.resolve(sb.auth.signInWithOAuth({
          provider: 'wechat',
          options: { redirectTo: opts.redirectTo }
        })).then(function (r) {
          if (r.error) return { data: null, error: r.error };
          return { data: { url: r.data && r.data.url }, error: null };
        });
      }
    };

    return {
      auth: auth,
      database: {
        from: function (table) { return sb.from(table); },
        rpc: function (name, params) { return sb.rpc(name, params); }
      }
    };
  };
})();

</script>

// 数据驱动选择：supabase > 云服务同域 > 本地
(function () {
  var cfg = window.APP_CONFIG || {};
  var mode = cfg.mode || 'auto';
  var epHost = '';
  try { epHost = new URL(cfg.endpoint || '').hostname; } catch (e) { epHost = ''; }

  var sdkReady = !!(window.WorkBuddyCloud && typeof window.WorkBuddyCloud.createWorkBuddyCloud === 'function');
  var sameOrigin = !!epHost && location.hostname === epHost;
  var sbReady = typeof window.__createSupabaseDriver === 'function' && !!cfg.supabaseUrl && !!cfg.supabaseAnonKey;

  var useCloud, useSb = false;
  if (mode === 'supabase') { useSb = true; useCloud = false; }
  else if (mode === 'cloud') useCloud = true;
  else if (mode === 'local') useCloud = false;
  else useCloud = sdkReady && sameOrigin;

  if (useSb) {
    if (sbReady) {
      try {
        window.cloud = window.__createSupabaseDriver(cfg);
        window.DATA_MODE = 'cloud';
        window.DATA_BACKEND = 'supabase';
        return;
      } catch (e) {
        window.CLOUD_INIT_ERROR = 'Supabase 初始化失败：' + (e && e.message);
      }
    } else {
      window.CLOUD_INIT_ERROR = 'Supabase 配置缺失（supabaseUrl / supabaseAnonKey）或 SDK 未加载';
    }
  }

  if (useCloud && sdkReady) {
    window.cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
      endpoint: cfg.endpoint,
      oauthRelayBaseUrl: cfg.oauthRelayBaseUrl,
      publishableKey: cfg.publishableKey
    });
    window.DATA_MODE = 'cloud';
    window.DATA_BACKEND = 'workbuddy';
    return;
  }

  if (typeof window.__createLocalDriver !== 'function') {
    window.CLOUD_INIT_ERROR = '数据驱动加载失败，请刷新页面重试';
    return;
  }
  window.cloud = window.__createLocalDriver();
  window.DATA_MODE = 'local';
  window.DATA_BACKEND = 'local';
  window.DATA_MODE_REASON = window.CLOUD_INIT_ERROR
    || (sdkReady ? '当前域名不是云服务自有域名，接口会被跨域校验拒绝，已切到本地数据' : '未配置云端，已切到本地数据');

  function badge() {
    var el = document.createElement('div');
    el.style.cssText = 'position:fixed;left:10px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;' +
      'font-size:11px;line-height:1;padding:6px 9px;border-radius:999px;color:#5b5f73;' +
      'background:rgba(255,255,255,.86);border:1px solid rgba(0,0,0,.06);' +
      'box-shadow:0 4px 14px rgba(17,24,39,.08);backdrop-filter:blur(6px);pointer-events:none;letter-spacing:.2px';
    el.textContent = '本地演示数据';
    el.title = window.DATA_MODE_REASON || '';
    document.body.appendChild(el);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', badge);
  else badge();
})();

  function ico(name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
  }

  /* ================= 工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function avatarBg(name) {
    var gs = [
      'linear-gradient(135deg,#8B5E3C,#5A3822)',
      'linear-gradient(135deg,#38bdf8,#6366f1)',
      'linear-gradient(135deg,#f472b6,#a855f7)',
      'linear-gradient(135deg,#fb923c,#f43f5e)',
      'linear-gradient(135deg,#34d399,#0ea5e9)'
    ];
    var s = name || 'S';
    var n = 0;
    for (var i = 0; i < s.length; i++) n += s.charCodeAt(i);
    return gs[n % gs.length];
  }
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }
  function fmtDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function ago(ts) {
    var diff = (Date.now() - new Date(ts).getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    if (diff < 86400 * 30) return Math.floor(diff / 86400) + ' 天前';
    return fmtDate(ts);
  }
  function genMemberId() {
    var A = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    var s = A[Math.floor(Math.random() * A.length)] + A[Math.floor(Math.random() * A.length)];
    for (var i = 0; i < 6; i++) s += Math.floor(Math.random() * 10);
    return s;
  }
  function uid() { return (state.session && state.session.user && state.session.user.id) || ''; }
  function isMember() {
    var p = state.profile;

  function daysLeft() {
    var p = state.profile;
    if (!p || !p.expire_at) return 0;

  /* ================= 登录 / 会话 ================= */
  async function handleOAuthReturn() {
    var url = new URL(location.href);
    if (!url.searchParams.has('code') && !url.searchParams.has('error')) return;
    var provider = url.searchParams.get('provider');
    if (provider !== 'wechat' && provider !== 'workbuddy') return;
    var fn = provider === 'wechat' ? cloud.auth.handleWechatWebCallback : cloud.auth.handleWorkBuddyCallback;
    if (typeof fn !== 'function') { toast('当前 SDK 不支持该登录方式'); return; }
    var res = await fn.call(cloud.auth);
    if (res.error) { toast(res.error.message); return; }
    if (res.data) {
      ['code', 'state', 'provider'].forEach(function (k) { url.searchParams.delete(k); });

      '<div class="card" data-act="go" data-to="#/payment" style="margin:14px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#8B5E3C,#5A3822);color:#fff;box-shadow:0 8px 22px rgba(139,94,60,.28)">' +

        '<div style="font-size:12px;color:rgba(255,255,255,.82);margin-top:3px">专栏 · 模板 · 直播回放，一次开通全站畅看</div></div>' +

      : '';

  function parseHash() {

  async function render() {
    var t = ++state.token;
    var seg = parseHash().seg;
    var name = seg[0] || 'feed';

    if (name !== 'login-member' && !state.session) { location.replace('#/login-member'); return; }
    if (name === 'login-member' && state.session) { location.replace('#/feed'); return; }

    app.innerHTML = skeleton();
    var html;
    try {
      switch (name) {
        case 'login-member': html = ViewLogin(); break;
        case 'feed': html = await ViewFeed(); break;
        case 'post': html = await ViewPost(seg[1]); break;
        case 'publish': html = ViewPublish(); break;
        case 'questions': html = await ViewQuestions(); break;
        case 'ask': html = ViewAsk(); break;
        case 'message': html = await ViewMessage(); break;
        case 'me': html = await ViewMe(); break;
        case 'payment': html = ViewPayment(); break;
        case 'payment-result': html = ViewResult(); break;
        case 'orders': html = await ViewOrders(); break;
        case 'admin': html = await ViewAdmin(); break;
        default: html = notFound();
      }
    } catch (e) {
      html = errorPage(e);
    }
    if (t !== state.token) return;
    app.innerHTML = html;
    window.scrollTo(0, 0);
    afterRender(name);
  }

  function afterRender(name) {
    if (name === 'publish') {
      var t = document.getElementById('postInput');
      var c = document.getElementById('postCount');
      if (t && c) t.addEventListener('input', function () { c.textContent = t.value.length; });
    }
    if (state.searching) {
      var s = document.getElementById('searchInput');
      if (s) {
        s.focus();
        s.addEventListener('input', function () {
          state.query = s.value.trim();
          var v = s.value;
          render().then(function () {
            var again = document.getElementById('searchInput');
            if (again) { again.focus(); again.value = v; }
          });
        });
      }
    }
  }

  function go(to) {
    if (!to) return;
    if (location.hash === to) render();
    else location.hash = to;
  }

  /* ================= 动作 ================= */
  var ACTIONS = {
    go: function (el) { go(el.dataset.to); },
    back: function () { if (history.length > 1) history.back(); else go('#/feed'); },
    soon: function () { toast('该功能即将开放'); },
    retry: function () { location.reload(); },

    tab: function (el) { state.tab = el.dataset.tab; render(); },

    'admin-tab': function (el) { adminState.tab = el.dataset.tab; render(); },

    'admin-del-post': async function (el) {
      if (!window.confirm('确定删除这条动态？删除后不可恢复')) return;
      var r = await cloud.database.from('posts').delete().eq('id', Number(el.dataset.id));
      if (r.error) return toast(errMsg(r.error));
      toast('已删除'); render();
    },

    'admin-vip': async function (el) {
      var next = el.dataset.vip !== '1';
      var r = await cloud.database.from('posts').update({ is_vip: next }).eq('id', Number(el.dataset.id));
      if (r.error) return toast(errMsg(r.error));
      toast(next ? '已设为 V+' : '已取消 V+'); render();
    },

    'admin-grant': async function (el) {
      var days = Number(el.dataset.days || 30);
      var exp = new Date(Date.now() + days * 864e5).toISOString();
      var r = await cloud.database.from('profiles').update({ expire_at: exp }).eq('owner_id', el.dataset.id);
      if (r.error) return toast(errMsg(r.error));
      toast('已延长 ' + days + ' 天'); render();
    },

    'admin-publish': async function () {
      var c = document.getElementById('apContent');
      var pv = document.getElementById('apPreview');
      var vip = document.getElementById('apVip');
      var content = c ? c.value.trim() : '';
      if (content.length < 5) return toast('正文至少 5 个字');
      var prof = state.profile || {};
      var row = {
        content: content,
        preview: pv && pv.value.trim() ? pv.value.trim() : content.replace(/\n+/g, ' ').slice(0, 40) + '…',
        is_vip: !!(vip && vip.checked),
        owner_id: uid(),
        owner_name: prof.nickname || (state.session && state.session.user && state.session.user.name) || '老王'
      };
      var r = await cloud.database.from('posts').insert(row).select();
      if (r.error) return toast(errMsg(r.error));
      toast('已发布');
      adminState.tab = 'posts';
      render();
    },
    'open-search': function () { state.searching = true; render(); },
    'close-search': function () { state.searching = false; state.query = ''; render(); },
    'open-post': function (el) { go('#/post/' + el.dataset.id); },

    'send-code': async function () {
      var acc = accountValue();
      if (!validAccount(acc)) {
        return toast(LOGIN === 'email' ? '请输入正确的邮箱地址' : '请输入正确的 11 位手机号');
      }
      var btn = document.getElementById('codeBtn');
      if (!btn || btn.disabled) return;
      btn.disabled = true;
      btn.textContent = '发送中…';
      var sent = await cloud.auth.sendOtp(accountPayload(acc));
      if (sent.error) { btn.disabled = false; btn.textContent = '获取验证码'; return toast(errMsg(sent.error)); }
      pendingOtp = { account: acc, verificationId: sent.data.verificationId, isExistingUser: sent.data.isExistingUser };
      startCountdown(btn);
      toast('验证码已发送');
    },

    'do-login': async function () {
      var acc = accountValue();
      var codeEl = document.getElementById('code');
      var code = codeEl ? codeEl.value.trim() : '';
      if (!validAccount(acc)) {
        return toast(LOGIN === 'email' ? '请输入正确的邮箱地址' : '请输入正确的 11 位手机号');
      }
      if (code.length !== 6) return toast('请输入 6 位验证码');
      if (!pendingOtp || pendingOtp.account !== acc) return toast('请先获取验证码');

      toast('登录中…');
      var payload = accountPayload(acc);
      payload.verificationId = pendingOtp.verificationId;
      payload.isExistingUser = pendingOtp.isExistingUser;
      payload.token = code;
      var res = await cloud.auth.verifyOtp(payload);
      if (res.error) return toast(errMsg(res.error));
      pendingOtp = null;
      await loadSession();
      go('#/feed');
    },

    'wechat-login': async function () {
      var back = new URL(location.href);
      back.pathname = '/';
      back.hash = '';
      ['code', 'state', 'provider'].forEach(function (k) { back.searchParams.delete(k); });
      var res = await cloud.auth.signInWithOAuth({ provider: 'wechat', redirectTo: back.toString() });
      if (res.error) return toast(errMsg(res.error));
      location.assign(res.data.url);
    },

    like: async function (el) {
      var id = Number(el.dataset.id);
      var res = await cloud.database.rpc('toggle_like', { p_post_id: id });
      if (res.error) return toast(errMsg(res.error));
      render();
    },

    'send-comment': async function (el) {
      var input = document.getElementById('cmtInput');
      if (!input || !input.value.trim()) return toast('说点什么再发送吧');
      var res = await cloud.database.from('comments').insert({
        post_id: Number(el.dataset.id),
        content: input.value.trim(),
        owner_name: (state.profile && state.profile.nickname) || '会员'
      });
      if (res.error) return toast(errMsg(res.error));
      render();
    },

    'publish-post': async function () {
      var t = document.getElementById('postInput');
      if (!t || !t.value.trim()) return toast('内容不能为空');
      var res = await cloud.database.from('posts').insert({
        content: t.value.trim(),
        owner_name: (state.profile && state.profile.nickname) || '会员'
      });
      if (res.error) return toast(errMsg(res.error));
      toast('发布成功');
      setTimeout(function () { go('#/feed'); }, 400);
    },

    'submit-question': async function () {
      var t = document.getElementById('qTitle');
      var d = document.getElementById('qDesc');
      if (!t || !t.value.trim()) return toast('请填写问题标题');
      var res = await cloud.database.from('questions').insert({
        title: t.value.trim(),
        detail: (d && d.value.trim()) || null,
        owner_name: (state.profile && state.profile.nickname) || '会员'
      });
      if (res.error) return toast(errMsg(res.error));
      toast('提交成功');
      setTimeout(function () { go('#/questions'); }, 400);
    },

    'read-msg': async function (el) {
      await cloud.database.from('messages').update({ is_read: true }).eq('id', Number(el.dataset.id));
      render();
    },

    'select-plan': function (el) { state.planId = el.dataset.id; render(); },

    pay: async function () {
      var cur = PLANS.filter(function (p) { return p.id === state.planId; })[0];
      if (!cur) return;
      var btn = document.querySelector('.pay-btn');
      if (btn) { btn.style.opacity = '.6'; btn.style.pointerEvents = 'none'; btn.textContent = '支付中…'; }
      try {
        var ins = await cloud.database.from('orders').insert({ plan: cur.name, days: cur.days, amount: cur.price }).select();
        if (ins.error) throw ins.error;
        var rpc = await cloud.database.rpc('pay_order', { p_order_id: ins.data[0].id });
        if (rpc.error) throw rpc.error;
        state.lastOrder = { plan: cur.name, price: cur.price };
        state.profile = await ensureProfile();
        go('#/payment-result');
      } catch (e) {
        toast(errMsg(e));
        if (btn) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; btn.textContent = '立即支付'; }
      }
    },

    logout: async function () {
      if (!window.confirm('确定要退出登录吗？')) return;
      await cloud.auth.signOut();
      state.session = null;
      state.profile = null;
      go('#/login-member');
    }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var fn = ACTIONS[el.dataset.act];
    if (!fn) { if (el.dataset.to) return go(el.dataset.to); return toast('该功能即将开放'); }
    var r = fn.call(el, el, e);
    if (r && r.catch) r.catch(function (err) { toast(errMsg(err)); });
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var id = e.target && e.target.id;
    if (id === 'code') { e.preventDefault(); ACTIONS['do-login'](); }
    if (id === 'cmtInput') {
      e.preventDefault();
      var b = document.querySelector('[data-act="send-comment"]');
      if (b) b.click();
    }
  });

  /* ================= 启动 ================= */
  async function boot() {
    if (window.CLOUD_INIT_ERROR || !window.cloud) {
      app.innerHTML = '<div class="boot-fail">' + esc(window.CLOUD_INIT_ERROR || '云服务未初始化') + '</div>';
      return;
    }
    try { await handleOAuthReturn(); } catch (e) { /* 回调失败按未登录处理 */ }
    await loadSession();
    if (!location.hash) location.replace(state.session ? '#/feed' : '#/login-member');
    else render();
  }
  window.addEventListener('hashchange', function () { render(); });
  boot();
})();

</script>
</body>
</html>
